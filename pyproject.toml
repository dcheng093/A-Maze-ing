[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "42 A-Maze-ing project"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["mazegen"]
py-modules = ["a_maze_ing"]

[tool.setuptools.data-files]
"." = ["Makefile", "default_config.txt"]